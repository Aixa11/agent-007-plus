name: Request a license
description: Ask for the invoice for Layers, Individual, or Organization
title: "License: "
labels: []
body:
  - type: dropdown
    id: licencia
    attributes:
      label: License
      options:
        - Layers — 1,800 USD / year — rule packs only
        - Individual — 2,400 USD / year — full project, one person
        - Organization — 12,000 USD / year — full project, one entity
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub username that should receive access
      placeholder: username
    validations:
      required: true
  - type: textarea
    id: entidad
    attributes:
      label: Name of the person or entity to invoice
    validations:
      required: true
  - type: textarea
    id: nota
    attributes:
      label: Note
      description: Billing country, or anything else. Do not write secrets.
